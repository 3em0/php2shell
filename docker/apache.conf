# php2shell: single-worker prefork, no keep-alive.
# Loaded from /etc/apache2/conf-enabled/ after mods-enabled, so these values
# override the distro defaults in mods-enabled/mpm_prefork.conf.
KeepAlive Off

<IfModule mpm_prefork_module>
    StartServers           1
    MinSpareServers        1
    MaxSpareServers        1
    MaxRequestWorkers      1
    ServerLimit            1
    MaxConnectionsPerChild 0
</IfModule>
